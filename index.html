<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="description" content="Summer Li’s student portfolio, work experience, and projects.">
  <meta name="color-scheme" content="light">
  <title>Summer Li</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --paper: #f5f3ec; --ink: #283b31; --muted: #68756a; --line: #d8ded1; --green: #65794a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { max-width: 1440px; min-height: 100svh; margin: auto; padding: 38px 6vw 26px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
    .monogram { font: italic 30px Georgia, serif; letter-spacing: -3px; }
    .label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    main { flex: 1; display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; gap: 7vw; padding: 70px 0; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--muted); margin: 0 0 28px; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    h1 { font: normal clamp(70px, 9vw, 132px)/.95 Georgia, "Times New Roman", serif; letter-spacing: -.065em; margin: 0 0 34px; }
    h1 span { display: block; font-style: italic; }
    .intro { font-size: clamp(18px, 2vw, 23px); line-height: 1.6; color: var(--muted); max-width: 340px; margin: 0; }
    nav { display: flex; gap: 22px; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 5px; }
    nav a { font-size: 12px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
    .portfolio { padding: 44px 0 64px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 2fr; gap: 32px; }
    .portfolio h2 { font: normal 36px Georgia, serif; letter-spacing: -.035em; margin: 0; }
    .portfolio p { color: var(--muted); line-height: 1.7; margin: 0; }
    .art { aspect-ratio: 4/5; width: 100%; max-width: 400px; justify-self: end; background: #e5e8da; border-radius: 180px 180px 5px 5px; position: relative; overflow: hidden; }
    .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; display: block; }
    .sun { position: absolute; width: 30%; aspect-ratio: 1; border-radius: 50%; background: #eab775; top: 17%; right: 17%; }
    .hill { position: absolute; width: 160%; height: 65%; border-radius: 50%; left: -55%; bottom: -16%; background: #83936a; transform: rotate(-23deg); }
    .hill.back { background: #b5be9a; left: 0; bottom: -3%; transform: rotate(30deg); }
    .hill.front { background: #425f48; left: -18%; bottom: -42%; transform: rotate(18deg); }
    footer { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--line); padding-top: 24px; color: var(--muted); font-size: 12px; }
    @media (max-width: 700px) {
      .page { padding: 26px 7vw 24px; }
      main { grid-template-columns: 1fr; gap: 48px; padding: 56px 0; }
      h1 { font-size: clamp(72px, 18vw, 114px); }
      .art { max-width: none; width: 100%; aspect-ratio: 5/4; border-radius: 180px 180px 5px 5px; }
      .portfolio { grid-template-columns: 1fr; gap: 20px; }
      footer { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="monogram" aria-label="Summer Li">sl.</span><nav aria-label="Portfolio"><a href="#experience">Experience</a><a href="#projects">Projects</a></nav></header>
    <main>
      <section aria-labelledby="name">
        <p class="eyebrow label">Student portfolio</p>
        <h1 id="name">Summer <span>Li.</span></h1>
        <p class="intro">Welcome to my personal website—a home for my work experience and projects.</p>
      </section>
      <div class="art"><img src="profile.png" alt="Summer Li at the beach" width="1242" height="1178"></div>
    </main>
    <section class="portfolio" id="experience" aria-labelledby="experience-title"><h2 id="experience-title">Work experience</h2><p>Experience details coming soon.</p></section>
    <section class="portfolio" id="projects" aria-labelledby="projects-title"><h2 id="projects-title">Projects</h2><p>Project details coming soon.</p></section>
    <footer><span>Summer Li</span><span>Thanks for stopping by.</span></footer>
  </div>
</body>
</html>
