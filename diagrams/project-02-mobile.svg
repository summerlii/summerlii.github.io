<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" role="img" aria-labelledby="title desc"><title id="title">Activation steering and preference measurement</title><desc id="desc">A behavioral steering space and pairwise-choice evaluation. Steering arrows show intervention directions, not empirical magnitudes.</desc><rect width="380" height="760" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(20 26)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. Change an internal direction</text><rect x="5" y="52" width="115" height="40" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="62.5" y="77.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Same prompt</text><path d="M122 72 L163 72" fill="none" stroke="#42654b" stroke-width="2"/><path d="M155.97933950487703 75.83540430883363 L163 72 L155.97933950487703 68.16459569116637" fill="none" stroke="#42654b" stroke-width="2"/><rect x="180" y="56" width="42" height="34" rx="8" fill="#fff" stroke="#42654b"/><circle cx="193" cy="69" r="3" fill="#42654b" stroke="none"/><circle cx="209" cy="69" r="3" fill="#42654b" stroke="none"/><path d="M192 80 Q201 85 210 80" fill="none" stroke="#42654b" stroke-width="2"/><path d="M201 56 V47" fill="none" stroke="#42654b" stroke-width="2"/><circle cx="201" cy="46" r="3" fill="#42654b" stroke="none"/><path d="M40 224 H300 M40 224 V113" fill="none" stroke="#677369" stroke-width="2"/><path d="M65 203 L239 125" fill="none" stroke="#53758e" stroke-width="2"/><path d="M234.1624766110583 131.37168482125742 L239 125 L231.02468705683475 124.3720004310664" fill="none" stroke="#53758e" stroke-width="2"/><path d="M65 203 L183 147" fill="none" stroke="#ad625b" stroke-width="2"/><path d="M178.30176242358132 153.47507248419103 L183 147 L175.0129457839699 146.54506599358126" fill="none" stroke="#ad625b" stroke-width="2"/><path d="M65 203 L272 203" fill="none" stroke="#b18a4c" stroke-width="2"/><path d="M264.97933950487703 206.83540430883363 L272 203 L264.97933950487703 199.16459569116637" fill="none" stroke="#b18a4c" stroke-width="2"/><text x="240" y="118" font-size="13" fill="#53758e" text-anchor="start" font-weight="400">Refusal</text><text x="110" y="136" font-size="13" fill="#ad625b" text-anchor="start" font-weight="400">Agreement</text><text x="211" y="224" font-size="12" fill="#b18a4c" text-anchor="start" font-weight="400">Random control</text><text x="45" y="262" font-size="20" fill="#283b31" text-anchor="start" font-weight="400">h′ = h + αv</text><text x="170" y="263" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Steer the activation</text></g><g transform="translate(20 402)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Test choices, not just tone</text><rect x="5" y="52" width="150" height="58" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="80.0" y="86.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Outcome A</text><rect x="175" y="52" width="150" height="58" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="250.0" y="86.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Outcome B</text><text x="165" y="87" font-size="13" fill="#283b31" text-anchor="middle" font-weight="400">or</text><path d="M165 118 L165 153" fill="none" stroke="#42654b" stroke-width="2"/><path d="M161.16459569116637 145.97933950487703 L165 153 L168.83540430883363 145.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><rect x="50" y="160" width="230" height="43" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="165.0" y="186.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Repeated pairwise choices</text><path d="M165 205 L165 232" fill="none" stroke="#42654b" stroke-width="2"/><path d="M161.16459569116637 224.97933950487703 L165 232 L168.83540430883363 224.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><text x="165" y="255" font-size="15" fill="#283b31" text-anchor="middle" font-weight="400">Preference ranking + consistency</text><text x="165" y="282" font-size="13" fill="#677369" text-anchor="middle" font-weight="400">Check fluency, controls, and replication</text></g></g></svg>