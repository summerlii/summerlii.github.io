d resources</text><text x="12" y="68" font-size="14" fill="#283b31" text-anchor="start" font-weight="500">Spectrum allocation</text><rect x="15" y="87" width="42" height="35" rx="3" fill="#53758e" stroke="#fff"/><rect x="61" y="87" width="42" height="35" rx="3" fill="#53758e" stroke="#fff"/><rect x="107" y="87" width="42" height="35" rx="3" fill="#53758e" stroke="#fff"/><rect x="153" y="87" width="42" height="35" rx="3" fill="#b18a4c" stroke="#fff"/><rect x="199" y="87" width="42" height="35" rx="3" fill="#b18a4c" stroke="#fff"/><rect x="245" y="87" width="42" height="35" rx="3" fill="#b18a4c" stroke="#fff"/><text x="79" y="146" font-size="13" fill="#53758e" text-anchor="middle" font-weight="400">Aircraft A</text><text x="235" y="146" font-size="13" fill="#b18a4c" text-anchor="middle" font-weight="400">Aircraft B</text><path d="M163 156 L163 182" fill="none" stroke="#42654b" stroke-width="2"/><path d="M159.16459569116637 174.97933950487703 L163 182 L166.83540430883363 174.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><rect x="45" y="188" width="245" height="46" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="167.5" y="216.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Multi-agent decisions</text><text x="165" y="261" font-size="15" fill="#283b31" text-anchor="middle" font-weight="400">Velocity + power + spectrum</text><text x="165" y="284" font-size="13" fill="#677369" text-anchor="middle" font-weight="400">Balance travel time and outages</text></g></g></svg>