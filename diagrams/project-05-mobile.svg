<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" role="img" aria-labelledby="title desc"><title id="title">A custom midterm connecting probability concepts</title><desc id="desc">A Bayesian sensor model and a collection of original midterm scenarios. Connections indicate assessment topics, not causal relationships between scenarios.</desc><rect width="380" height="760" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(20 26)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. One scenario, several concepts</text><rect x="5" y="60" width="112" height="45" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="61.0" y="87.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Prior: theft</text><rect x="197" y="60" width="128" height="45" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="261.0" y="87.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Calibration α</text><path d="M62 114 L130 164" fill="none" stroke="#42654b" stroke-width="2"/><path d="M122.071740876363 162.93102513197616 L130 164 L126.61585464890972 156.75103040131262" fill="none" stroke="#42654b" stroke-width="2"/><path d="M260 114 L201 164" fill="none" stroke="#42654b" stroke-width="2"/><path d="M203.87635890855458 156.53497760022256 L201 164 L208.83570310115013 162.38700374748532" fill="none" stroke="#42654b" stroke-width="2"/><rect x="103" y="171" width="145" height="45" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="175.5" y="198.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Sensor reading</text><path d="M177 224 L177 255" fill="none" stroke="#42654b" stroke-width="2"/><path d="M173.16459569116637 247.97933950487703 L177 255 L180.83540430883363 247.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><text x="177" y="279" font-size="18" fill="#283b31" text-anchor="middle" font-weight="400">P(theft | reading)</text><text x="12" y="314" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Likelihood + uncertainty + Bayes’ rule</text></g><g transform="translate(20 402)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Probability in familiar settings</text><rect x="7" y="58" width="152" height="55" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="83.0" y="90.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Classroom questions</text><rect x="181" y="58" width="152" height="55" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="257.0" y="90.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Typing contest</text><rect x="7" y="130" width="152" height="55" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="83.0" y="162.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">College applications</text><rect x="181" y="130" width="152" height="55" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="257.0" y="162.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Course enrollment</text><path d="M85 191 V218 H255 V191" fill="none" stroke="#42654b" stroke-width="2"/><path d="M171 218 L171 242" fill="none" stroke="#42654b" stroke-width="2"/><path d="M167.16459569116637 234.97933950487703 L171 242 L174.83540430883363 234.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><text x="171" y="267" font-size="12" fill="#283b31" text-anchor="middle" font-weight="400">Poisson · expectation · conditional probability</text><text x="171" y="300" font-size="15" fill="#283b31" text-anchor="middle" font-weight="400">Custom midterm + worked solutions</text></g></g></svg>