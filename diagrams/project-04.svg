<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">CVE text and structured security predictions</title><desc id="desc">An illustrative CVE description feeds two alternative model approaches that predict four kinds of structured security labels.</desc><rect width="760" height="420" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(25 32)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. From prose to structured triage</text><rect x="5" y="55" width="320" height="92" rx="10" fill="#fff" stroke="#d5ddce"/><text x="20" y="80" font-size="14" fill="#283b31" text-anchor="start" font-weight="600">CVE description</text><text x="20" y="105" font-size="13" fill="#677369" text-anchor="start" font-weight="400">“An attacker can exploit an input… ”</text><text x="20" y="124" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Illustrative description</text><path d="M165 151 L165 176" fill="none" stroke="#42654b" stroke-width="2"/><path d="M161.16459569116637 168.97933950487703 L165 176 L168.83540430883363 168.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><rect x="5" y="185" width="150" height="50" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="80.0" y="215.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">TF-IDF baseline</text><rect x="175" y="185" width="150" height="50" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="250.0" y="215.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">LoRA-tuned SLM</text><text x="165" y="265" font-size="14" fill="#677369" text-anchor="middle" font-weight="400">Compare both approaches</text></g><g transform="translate(395 32)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Several related prediction targets</text><rect x="10" y="50" width="310" height="209" rx="10" fill="#fff" stroke="#d5ddce"/><path d="M20 94 H310" fill="none" stroke="#d5ddce" stroke-width="1"/><path d="M20 135 H310" fill="none" stroke="#d5ddce" stroke-width="1"/><path d="M20 176 H310" fill="none" stroke="#d5ddce" stroke-width="1"/><path d="M20 217 H310" fill="none" stroke="#d5ddce" stroke-width="1"/><text x="25" y="78" font-size="15" fill="#283b31" text-anchor="start" font-weight="400">CVSS score</text><text x="218" y="78" font-size="14" fill="#53758e" text-anchor="start" font-weight="400">0–10</text><text x="25" y="119" font-size="15" fill="#283b31" text-anchor="start" font-weight="400">Severity</text><text x="218" y="119" font-size="14" fill="#53758e" text-anchor="start" font-weight="400">Category</text><text x="25" y="160" font-size="15" fill="#283b31" text-anchor="start" font-weight="400">CWE</text><text x="218" y="160" font-size="14" fill="#53758e" text-anchor="start" font-weight="400">Weakness</text><text x="25" y="201" font-size="15" fill="#283b31" text-anchor="start" font-weight="400">CVSS vector</text><text x="218" y="201" font-size="14" fill="#53758e" text-anchor="start" font-weight="400">8 fields</text><text x="25" y="243" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Evaluate accuracy and score error</text><text x="13" y="283" font-size="14" fill="#677369" text-anchor="start" font-weight="400">Train: 2022–2023   →   Test: 2024</text></g></g></svg>