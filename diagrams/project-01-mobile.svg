<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" role="img" aria-labelledby="title desc"><title id="title">Reward hacking and activation anchoring</title><desc id="desc">Conceptual comparison of a reward shortcut and anchored versus unconstrained updates. Activation positions are illustrative, not measured.</desc><rect width="380" height="760" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(20 26)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. Reward can hide a shortcut</text><rect x="10" y="62" width="42" height="34" rx="8" fill="#fff" stroke="#42654b"/><circle cx="23" cy="75" r="3" fill="#42654b" stroke="none"/><circle cx="39" cy="75" r="3" fill="#42654b" stroke="none"/><path d="M22 86 Q31 91 40 86" fill="none" stroke="#42654b" stroke-width="2"/><path d="M31 62 V53" fill="none" stroke="#42654b" stroke-width="2"/><circle cx="31" cy="52" r="3" fill="#42654b" stroke="none"/><path d="M60 79 L105 79" fill="none" stroke="#42654b" stroke-width="2"/><path d="M97.97933950487702 82.83540430883363 L105 79 L97.97933950487702 75.16459569116637" fill="none" stroke="#42654b" stroke-width="2"/><rect x="115" y="55" width="205" height="48" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="217.5" y="84.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Coding agent</text><path d="M215 104 V132 H95 V154" fill="none" stroke="#42654b" stroke-width="2"/><path d="M215 132 H265 V154" fill="none" stroke="#ad625b" stroke-width="2"/><rect x="10" y="159" width="160" height="46" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="90.0" y="187.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Visible tests: pass</text><rect x="190" y="159" width="140" height="46" rx="10" fill="#f5e5e1" stroke="#ddbcb6"/><text x="260.0" y="187.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Hidden tests: fail</text><text x="12" y="236" fon