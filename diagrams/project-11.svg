<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Auditable support-agent reasoning and improvement</title><desc id="desc">An incident branches into evidence and hypotheses before a response. A separate evaluation cycle connects the agent, judge, reasoning gaps, and context fixes.</desc><rect width="760" height="420" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(25 32)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. Investigate with a reasoning graph</text><rect x="103" y="52" width="138" height="45" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="172.0" y="79.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Support incident</text><path d="M146 99 L82 133" fill="none" stroke="#42654b" stroke-width="2"/><path d="M86.40065566905125 126.31911460340419 L82 133 L89.99945561938226 133.09332627461552" fill="none" stroke="#42654b" stroke-width="2"/><path d="M198 99 L265 133" fill="none" stroke="#42654b" stroke-width="2"/><path d="M257.00369637485505 133.24316318490537 L265 133 L260.47496394824105 126.40272414323293" fill="none" stroke="#42654b" stroke-width="2"/><rect x="5" y="143" width="147" height="43" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="78.5" y="169.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Evidence</text><rect x="188" y="143" width="147" height="43" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="261.5" y="169.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Hypothesis</text><path d="M80 191 L146 230" fill="none" stroke="#42654b" stroke-width="2"/><path d="M138.0045445384019 229.73038553154376 L146 230 L141.90690972992286 223.12638289973904" fill="none" stroke="#42654b" stroke-width="2"/><path d="M260 191 L198 230" fill="none" stroke="#42654b" stroke-width="2"/><path d="M201.9005482532894 223.0153222462478 L198 230 L205.98487888341788 229.50836068388793" fill="none" stroke="#42654b" stroke-width="2"/><rect x="104" y="238" width="138" height="43" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="173.0" y="264.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Agent response</text><path d="M152 164 H188" fill="none" stroke="#53758e" stroke-width="2"/><text x="92" y="304" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Keep inference steps auditable</text></g><g transform="translate(395 32)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Close the evaluation loop</text><rect x="145" y="60" width="42" height="34" rx="8" fill="#fff" stroke="#42654b"/><circle cx="158" cy="73" r="3" fill="#42654b" stroke="none"/><circle cx="174" cy="73" r="3" fill="#42654b" stroke="none"/><path d="M157 84 Q166 89 175 84" fill="none" stroke="#42654b" stroke-width="2"/><path d="M166 60 V51" fill="none" stroke="#42654b" stroke-width="2"/><circle cx="166" cy="50" r="3" fill="#42654b" stroke="none"/><text x="165" y="115" font-size="14" fill="#283b31" text-anchor="middle" font-weight="400">Support agent</text><path d="M195 113 L259 148" fill="none" stroke="#42654b" stroke-width="2"/><path d="M251.00000077726492 147.99647349493586 L259 148 L254.68054942470215 141.2663273967649" fill="none" stroke="#42654b" stroke-width="2"/><rect x="191" y="162" width="144" height="46" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="263.0" y="190.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">LLM judge</text><path d="M253 214 L193 252" fill="none" stroke="#42654b" stroke-width="2"/><path d="M196.87904685164506 245.00335826823022 L193 252 L200.98332896689473 251.48380371336125" fill="none" stroke="#42654b" stroke-width="2"/><rect x="67" y="260" width="196" height="41" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="165.0" y="285.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Reasoning gap</text><path d="M57 274 L32 183" fill="none" stroke="#53758e" stroke-width="2"/><path d="M37.55822166512694 188.75379630516352 L32 183 L30.16146733890435 190.78587166951039" fill="none" stroke="#53758e" stroke-width="2"/><rect x="0" y="143" width="147" height="46" rx="10" fill="#e4edf2" stroke="#b8ccd9"/><text x="73.5" y="171.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Context fix</text><path d="M89 135 L141 103" fill="none" stroke="#53758e" stroke-width="2"/><path d="M137.03092162521108 109.94596406949985 L141 103 L133.01067057592786 103.41305611441464" fill="none" stroke="#53758e" stroke-width="2"/><text x="20" y="335" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Google ADK + LiteLLM</text></g></g></svg>