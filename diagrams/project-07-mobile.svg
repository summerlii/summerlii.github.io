<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" role="img" aria-labelledby="title desc"><title id="title">Future trajectory prediction from flight histories</title><desc id="desc">Observed, predicted, and actual flight paths are schematic examples. Curves do not represent a dataset or measured prediction error.</desc><rect width="380" height="760" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(20 26)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. Predict a future flight path</text><path d="M30 245 H310 M30 245 V70" fill="none" stroke="#677369" stroke-width="2"/><text x="10" y="62" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Altitude</text><text x="239" y="271" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Position</text><path d="M40 227 C88 202 118 160 165 148" fill="none" stroke="#53758e" stroke-width="3"/><circle cx="40" cy="227" r="4" fill="#53758e" stroke="none"/><circle cx="75" cy="210" r="4" fill="#53758e" stroke="none"/><circle cx="110" cy="180" r="4" fill="#53758e" stroke="none"/><circle cx="140" cy="155" r="4" fill="#53758e" stroke="none"/><circle cx="165" cy="148" r="4" fill="#53758e" stroke="none"/><path d="M165 148 C211 133 246 100 290 87" fill="none" stroke="#42654b" stroke-width="3" stroke-dasharray="6 4"/><path d="M165 148 C205 143 255 119 290 104" fill="none" stroke="#b18a4c" stroke-width="2"/><path d="M148 149 H182 M165 134 V161 M157 159 H173" fill="none" stroke="#53758e" stroke-width="3"/><text x="48" y="292" font-size="13" fill="#53758e" text-anchor="start" font-weight="400">Observed</text><text x="150" y="292" font-size="13" fill="#42654b" text-anchor="start" font-weight="400">Predicted</text><text x="251" y="292" font-size="13" fill="#b18a4c" text-anchor="start" font-weight="400">Actual</text></g><g transform="translate(20 402)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Learn temporal structure</text><rect x="10" y="58" width="310" height="68" rx="10" fill="#fff" stroke="#d5ddce"/><rect x="23" y="74" width="49" height="36" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="47.5" y="97.0" font-size="12" fill="#283b31" text-anchor="middle" font-weight="500">t−4</text><rect x="81" y="74" width="49" height="36" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="105.5" y="97.0" font-size="12" fill="#283b31" text-anchor="middle" font-weight="500">t−3</text><rect x="139" y="74" width="49" height="36" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="163.5" y="97.0" font-size="12" fill="#283b31" text-anchor="middle" font-weight="500">t−2</text><rect x="197" y="74" width="49" height="36" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="221.5" y="97.0" font-size="12" fill="#283b31" text-anchor="middle" font-weight="500">t−1</text><rect x="255" y="74" width="49" height="36" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="279.5" y="97.0" font-size="12" fill="#283b31" text-anchor="middle" font-weight="500">t</text><path d="M165 133 L165 164" fill="none" stroke="#42654b" stroke-width="2"/><path d="M161.16459569116637 156.97933950487703 L165 164 L168.83540430883363 156.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><rect x="20" y="172" width="290" height="47" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="165.0" y="200.5" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Recurrent / hybrid predictor</text><path d="M165 222 L165 244" fill="none" stroke="#42654b" stroke-width="2"/><path d="M161.16459569116637 236.97933950487703 L165 244 L168.83540430883363 236.97933950487703" fill="none" stroke="#42654b" stroke-width="2"/><text x="165" y="266" font-size="13" fill="#283b31" text-anchor="middle" font-weight="400">Latitude · longitude · altitude · time</text><text x="165" y="290" font-size="13" fill="#677369" text-anchor="middle" font-weight="400">Measure horizontal and vertical error