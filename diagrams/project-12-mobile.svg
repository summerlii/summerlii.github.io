<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" role="img" aria-labelledby="title desc"><title id="title">An MCP hub for enterprise API access</title><desc id="desc">Agent-to-server connection and a hub-and-spoke service graph. API boxes are generic examples, not named internal services.</desc><rect width="380" height="760" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(20 26)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. A common interface for an agent</text><rect x="10" y="135" width="42" height="34" rx="8" fill="#fff" stroke="#42654b"/><circle cx="23" cy="148" r="3" fill="#42654b" stroke="none"/><circle cx="39" cy="148" r="3" fill="#42654b" stroke="none"/><path d="M22 159 Q31 164 40 159" fill="none" stroke="#42654b" stroke-width="2"/><path d="M31 135 V126" fill="none" stroke="#42654b" stroke-width="2"/><circle cx="31" cy="125" r="3" fill="#42654b" stroke="none"/><path d="M60 152 L114 152" fill="none" stroke="#42654b" stroke-width="2"/><path d="M106.97933950487702 155.83540430883363 L114 152 L106.97933950487702 148.16459569116637" fill="none" stroke="#42654b" stroke-width="2"/><rect x="123" y="123" width="200" height="58" rx="10" fill="#e9eddf" stroke="#c8d4c0"/><text x="223.0" y="157.0" font-size="14" fill="#283b31" text-anchor="middle" font-weight="500">Dynamic MCP server</text><text x="5" y="218" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Language-model agent</text><text x="135" y="217" font-size="13" fill="#677369" text-anchor="start" font-weight="400">FastMCP + Flask</text><text x="12" y="277" font-size="15" fill="#283b31" text-anchor="start" font-weight="400">One model-facing tool interface</text></g><g transform="translate(20 402)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Connect many enterprise services</text><rect x="94" y="140" width="144" height="47" rx="10" fill="#e9e