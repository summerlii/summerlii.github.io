<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" role="img" aria-labelledby="title desc"><title id="title">Lattice geometry, square sums, and polygonal numbers</title><desc id="desc">A lattice triangle with legs three and four and hypotenuse five, beside triangular and square dot patterns. These illustrate report topics rather than a new theorem.</desc><rect width="380" height="760" fill="#fafbf7" rx="14"/><g font-family="system-ui, -apple-system, sans-serif"><g transform="translate(20 26)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">A. Geometry becomes arithmetic</text><circle cx="33" cy="64" r="2.5" fill="#9aab97" stroke="none"/><circle cx="33" cy="102" r="2.5" fill="#9aab97" stroke="none"/><circle cx="33" cy="140" r="2.5" fill="#9aab97" stroke="none"/><circle cx="33" cy="178" r="2.5" fill="#9aab97" stroke="none"/><circle cx="33" cy="216" r="2.5" fill="#9aab97" stroke="none"/><circle cx="33" cy="254" r="2.5" fill="#9aab97" stroke="none"/><circle cx="71" cy="64" r="2.5" fill="#9aab97" stroke="none"/><circle cx="71" cy="102" r="2.5" fill="#9aab97" stroke="none"/><circle cx="71" cy="140" r="2.5" fill="#9aab97" stroke="none"/><circle cx="71" cy="178" r="2.5" fill="#9aab97" stroke="none"/><circle cx="71" cy="216" r="2.5" fill="#9aab97" stroke="none"/><circle cx="71" cy="254" r="2.5" fill="#9aab97" stroke="none"/><circle cx="109" cy="64" r="2.5" fill="#9aab97" stroke="none"/><circle cx="109" cy="102" r="2.5" fill="#9aab97" stroke="none"/><circle cx="109" cy="140" r="2.5" fill="#9aab97" stroke="none"/><circle cx="109" cy="178" r="2.5" fill="#9aab97" stroke="none"/><circle cx="109" cy="216" r="2.5" fill="#9aab97" stroke="none"/><circle cx="109" cy="254" r="2.5" fill="#9aab97" stroke="none"/><circle cx="147" cy="64" r="2.5" fill="#9aab97" stroke="none"/><circle cx="147" cy="102" r="2.5" fill="#9aab97" stroke="none"/><circle cx="147" cy="140" r="2.5" fill="#9aab97" stroke="none"/><circle cx="147" cy="178" r="2.5" fill="#9aab97" stroke="none"/><circle cx="147" cy="216" r="2.5" fill="#9aab97" stroke="none"/><circle cx="147" cy="254" r="2.5" fill="#9aab97" stroke="none"/><circle cx="185" cy="64" r="2.5" fill="#9aab97" stroke="none"/><circle cx="185" cy="102" r="2.5" fill="#9aab97" stroke="none"/><circle cx="185" cy="140" r="2.5" fill="#9aab97" stroke="none"/><circle cx="185" cy="178" r="2.5" fill="#9aab97" stroke="none"/><circle cx="185" cy="216" r="2.5" fill="#9aab97" stroke="none"/><circle cx="185" cy="254" r="2.5" fill="#9aab97" stroke="none"/><circle cx="223" cy="64" r="2.5" fill="#9aab97" stroke="none"/><circle cx="223" cy="102" r="2.5" fill="#9aab97" stroke="none"/><circle cx="223" cy="140" r="2.5" fill="#9aab97" stroke="none"/><circle cx="223" cy="178" r="2.5" fill="#9aab97" stroke="none"/><circle cx="223" cy="216" r="2.5" fill="#9aab97" stroke="none"/><circle cx="223" cy="254" r="2.5" fill="#9aab97" stroke="none"/><path d="M33 254 L147 102" fill="none" stroke="#53758e" stroke-width="3"/><path d="M33 254 H147 V102" fill="none" stroke="#42654b" stroke-width="2" stroke-dasharray="5 4"/><text x="93" y="276" font-size="14" fill="#42654b" text-anchor="start" font-weight="400">3</text><text x="172" y="191" font-size="14" fill="#42654b" text-anchor="start" font-weight="400">4</text><text x="60" y="161" font-size="17" fill="#53758e" text-anchor="start" font-weight="400">5</text><text x="170" y="65" font-size="13" fill="#677369" text-anchor="start" font-weight="400">Lattice points</text><text x="25" y="310" font-size="22" fill="#283b31" text-anchor="start" font-weight="400">3² + 4² = 5²</text></g><g transform="translate(20 402)"><text x="0" y="22" font-size="17" fill="#283b31" text-anchor="start" font-weight="600">B. Squares and polygonal numbers</text><text x="15" y="76" font-size="19" fill="#283b31" text-anchor="start" font-weight="400">When is n = a² + b²?</text><text x="15" y="109" font-size="12" fill="#677369" text-anchor="start" font-weight="400">Use modular arithmetic and Gauss